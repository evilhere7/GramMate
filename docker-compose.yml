version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: grammate-db
    environment:
      POSTGRES_USER: grammate
      POSTGRES_PASSWORD: grammate_dev_password
      POSTGRES_DB: grammate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grammate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: grammate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: grammate-backend
    environment:
      DATABASE_URL: "postgresql://grammate:grammate_dev_password@db:5432/grammate"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "dev-secret-key-change-in-prod"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      STRIPE_API_KEY: "sk_test_"
      PLAID_CLIENT_ID: "test_id"
      PLAID_SECRET: "test_secret"
      PLAID_ENV: "sandbox"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_S3_BUCKET: "grammate-videos"
      AWS_REGION: "us-east-1"
      SENDGRID_API_KEY: ""
      ENVIRONMENT: "development"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Application
  frontend:
    build: ./frontend
    container_name: grammate-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:8000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: grammate-network
