<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Premium Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- PWA Manifest & Mobile Customization -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GramMate" />
    
    <!-- Mobile Viewport Setup -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary SEO Metadata -->
    <title>GramMate — Watch. Create. Earn.</title>
    <meta name="title" content="GramMate — Watch. Create. Earn." />
    <meta name="description" content="GramMate is the next-generation creator-first social platform where attention has value. Watch engaging videos, upload original content, and earn real-time rewards." />
    <meta name="keywords" content="social media, video monetization, watch and earn, content creators, digital wallet, revenue sharing, short-form video" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph (Facebook / LinkedIn / Slack / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grammate.com/" />
    <meta property="og:title" content="GramMate — Watch. Create. Earn." />
    <meta property="og:description" content="Empowering everyone in the digital economy. Creators earn 80% of ad revenues + tips, while viewers get real-time rewards for watching videos." />
    <meta property="og:image" content="https://grammate.com/og-preview.png" />
    <meta property="og:site_name" content="GramMate Platform" />
    
    <!-- Twitter (X) Card Integration -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://grammate.com/" />
    <meta property="twitter:title" content="GramMate — Watch. Create. Earn." />
    <meta property="twitter:description" content="Where entertainment meets income. Real-time creator payouts, viewer earnings, and transparent monetization." />
    <meta property="twitter:image" content="https://grammate.com/og-preview.png" />
    
    <!-- Premium Fonts (Outfit & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#09090b] text-[#fafafa] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
